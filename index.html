<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 30 Días</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --wellness-green: #10b981;
      --wellness-teal: #14b8a6;
      --wellness-coral: #f97316;
      --wellness-sage: #6b7280;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --surface-0: #ffffff;
      --surface-1: #f9fafb;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f3f4f6;
        --text-secondary: #d1d5db;
        --surface-0: #111827;
        --surface-1: #1f2937;
        --border: #374151;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
    }
    
    .container { max-width: 100%; padding: 1rem; }
    
    /* Setup */
    .setup-screen { display: none; }
    .setup-screen.show { display: flex; min-height: 100vh; justify-content: center; align-items: center; padding: 2rem; }
    .setup-card { background: var(--surface-1); border: 2px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 500px; width: 100%; }
    .setup-title { font-size: 24px; font-weight: 600; margin-bottom: 1.5rem; text-align: center; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .setup-step { margin-bottom: 1.5rem; }
    .setup-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; }
    .setup-input, .setup-select { width: 100%; padding: 0.75rem; background: var(--surface-0); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text-primary); font-family: inherit; margin-bottom: 0.5rem; }
    .setup-input:focus, .setup-select:focus { outline: none; border-color: var(--wellness-teal); }
    
    .habits-list { max-height: 300px; overflow-y: auto; }
    .habit-edit-item { display: flex; gap: 8px; margin-bottom: 0.5rem; }
    .habit-edit-item input { flex: 1; }
    .btn-remove { padding: 0.5rem 0.75rem; background: rgba(249, 115, 22, 0.15); color: var(--wellness-coral); border: 1px solid var(--wellness-coral); border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-add { padding: 0.75rem; background: rgba(16, 185, 129, 0.15); color: var(--wellness-green); border: 1px solid var(--wellness-green); border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; }
    
    .btn-primary { padding: 0.875rem; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-primary:hover { transform: translateY(-2px); }
    
    .setup-buttons { display: flex; gap: 1rem; }
    
    /* Main */
    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 18px; font-weight: 500; margin-bottom: 0.5rem; }
    .header-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .header-status { font-size: 12px; padding: 6px 12px; border-radius: 6px; }
    .header-status.open { background: rgba(16, 185, 129, 0.15); color: var(--wellness-green); }
    .header-status.closed { background: rgba(249, 115, 22, 0.15); color: var(--wellness-coral); }
    
    .top-buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .btn-edit-habits, .close-day-btn { padding: 0.75rem 1rem; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
    .close-day-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .progress-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 2rem; }
    .progress-card { background: var(--surface-1); border: 2px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
    .progress-card .name { font-size: 13px; color: var(--wellness-sage); font-weight: 500; margin-bottom: 0.75rem; text-transform: uppercase; }
    .progress-card .number { font-size: 28px; font-weight: 600; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    
    .checklist { margin-bottom: 2rem; }
    .checklist-header { font-size: 14px; font-weight: 600; color: var(--wellness-teal); margin-bottom: 1.25rem; text-align: center; text-transform: uppercase; }
    
    .people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .person-name { font-size: 13px; font-weight: 600; color: var(--wellness-green); margin-bottom: 0.75rem; text-align: center; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border); }
    
    .habit-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem; margin-bottom: 8px; background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; }
    .habit-item:hover:not(.disabled) { border-color: var(--wellness-teal); }
    .habit-item.checked { background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(20, 184, 166, 0.1)); border-color: var(--wellness-green); }
    .habit-item.disabled { opacity: 0.5; cursor: not-allowed; }
    
    .habit-checkbox { width: 20px; height: 20px; border: 1.5px solid #d1d5db; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-0); }
    .habit-item.checked .habit-checkbox { background: var(--wellness-green); border-color: var(--wellness-green); color: white; }
    
    .habit-label { font-size: 13px; flex: 1; }
    
    .shared-habit { background: linear-gradient(135deg, rgba(20, 184, 166, 0.1), rgba(16, 185, 129, 0.1)); border-color: var(--wellness-teal) !important; grid-column: 1 / -1; }
    
    .calendar { margin-bottom: 2rem; }
    .calendar-header { font-size: 13px; font-weight: 600; color: var(--wellness-teal); margin-bottom: 1rem; text-transform: uppercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); }
    .day-cell.today { border: 2px solid var(--wellness-coral); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
    .day-cell.complete { background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); color: white; }
    .day-cell.partial { background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(20, 184, 166, 0.15)); }
    .day-cell.incomplete { background: var(--surface-1); }
    .day-cell.closed { border-style: dashed; opacity: 0.6; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 2rem; }
    .stat-box { background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 12px; padding: 1.25rem; border-left: 4px solid var(--wellness-green); }
    .stat-box:nth-child(2) { border-left-color: var(--wellness-teal); }
    .stat-label { font-size: 12px; color: var(--wellness-sage); margin-bottom: 0.75rem; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 600; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    
    .charts-section { margin-bottom: 2rem; }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .chart-container { background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .chart-title { font-size: 13px; font-weight: 600; color: var(--wellness-teal); margin-bottom: 1rem; text-align: center; text-transform: uppercase; }
    
    .messages-section { margin-bottom: 2rem; }
    .messages-header { font-size: 14px; font-weight: 600; color: var(--wellness-teal); margin-bottom: 1rem; text-transform: uppercase; }
    .input-group { display: flex; gap: 8px; margin-bottom: 1rem; }
    .person-select { padding: 0.75rem; background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; }
    .message-input { flex: 1; padding: 0.75rem; background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; resize: none; }
    .send-btn { padding: 0.75rem 1.25rem; background: linear-gradient(135deg, var(--wellness-green), var(--wellness-teal)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    
    .messages-list { display: flex; flex-direction: column-reverse; gap: 10px; max-height: 300px; overflow-y: auto; }
    .message-bubble { padding: 0.875rem; background: var(--surface-1); border-left: 3px solid var(--wellness-teal); border-radius: 8px; }
    .message-bubble.sebastian { border-left-color: var(--wellness-green); }
    .message-bubble.ale { border-left-color: var(--wellness-coral); }
    .message-author { font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 0.25rem; }
    .message-text { font-size: 13px; }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface-0); border-radius: 12px; max-width: 90vw; padding: 1.5rem; border: 2px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close { font-size: 24px; cursor: pointer; background: none; border: none; }
    .modal-content { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .modal-person { background: var(--surface-1); border-radius: 8px; padding: 1rem; }
    .modal-person-name { font-size: 14px; font-weight: 600; color: var(--wellness-green); margin-bottom: 1rem; }
    
    .loading { text-align: center; padding: 2rem; color: var(--wellness-sage); }
  </style>
</head>
<body>

<!-- SETUP -->
<div class="setup-screen" id="setup-screen">
  <div class="setup-card">
    <div class="setup-title">🌿 Reto 30 Días</div>
    
    <div class="setup-step">
      <div class="setup-label">¿Quién eres?</div>
      <select class="setup-select" id="setup-name">
        <option value="">-- Elige tu nombre --</option>
        <option value="sebastian">Sebastián</option>
        <option value="ale">Ale</option>
      </select>
    </div>

    <div class="setup-step" id="habits-config" style="display:none;">
      <div class="setup-label">Configura los hábitos</div>
      <div class="habits-list" id="habits-list"></div>
      <button class="btn-add" onclick="addHabitInput()">+ Agregar hábito</button>
    </div>

    <div class="setup-buttons">
      <button class="btn-primary" onclick="startReto()">Comenzar</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="container" id="main-app" style="display:none;">
  <div class="header">
    <h1>Reto 30 días</h1>
    <div class="header-meta">
      <span id="current-day">Día 1</span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="day-status" class="header-status open">Abierto</div>
  </div>

  <div class="top-buttons">
    <button class="btn-edit-habits" id="btn-edit" style="display:none;" onclick="editHabitsMode()">✎ Editar</button>
    <button class="close-day-btn" id="close-day-btn" onclick="closeDay()">Cerrar Día</button>
  </div>

  <div class="progress-cards">
    <div class="progress-card">
      <div class="name">Sebastián</div>
      <div class="number" id="pct-sebastian">0%</div>
    </div>
    <div class="progress-card">
      <div class="name">Ale</div>
      <div class="number" id="pct-ale">0%</div>
    </div>
  </div>

  <div class="checklist">
    <div class="checklist-header">Hoy</div>
    <div class="people-grid">
      <div>
        <div class="person-name">Sebastián</div>
        <div id="list-sebastian"></div>
      </div>
      <div>
        <div class="person-name">Ale</div>
        <div id="list-ale"></div>
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="calendar-header">Progreso 30 días</div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">Racha Sebastián</div>
      <div class="stat-value" id="streak-sebastian">0 días</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Racha Ale</div>
      <div class="stat-value" id="streak-ale">0 días</div>
    </div>
  </div>

  <div class="charts-section">
    <div class="chart-grid">
      <div class="chart-container">
        <div class="chart-title">Cumplimiento</div>
        <canvas id="pie-chart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">Progreso</div>
        <canvas id="doughnut-chart"></canvas>
      </div>
    </div>
    <div class="chart-container">
      <div class="chart-title">Por Hábito</div>
      <canvas id="bar-chart"></canvas>
    </div>
  </div>

  <div class="messages-section">
    <div class="messages-header">Mensajes</div>
    <div class="input-group">
      <select class="person-select" id="sender-select">
        <option value="sebastian">Sebastián</option>
        <option value="ale">Ale</option>
      </select>
      <textarea class="message-input" id="message-input" placeholder="Mensaje..." rows="2"></textarea>
      <button class="send-btn" onclick="sendMessage()">Enviar</button>
    </div>
    <div class="messages-list" id="messages-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="day-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Día 1</div>
      <button class="modal-close" onclick="closeDayModal()">✕</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCW0OoRf_p5WMYZprI3JcsCQiuDlh1vev8",
  authDomain: "reto-30dias.firebaseapp.com",
  projectId: "reto-30dias",
  storageBucket: "reto-30dias.firebasestorage.app",
  messagingSenderId: "415328361570",
  appId: "1:415328361570:web:8762947b9c5453e51b853b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = localStorage.getItem('reto-user');
let habits = [];
let data = {};
let closedDays = {};
let messages = [];
const sharedHabit = 'Conexión';

function isSebastian() {
  return currentUser === 'sebastian';
}

function startReto() {
  const name = document.getElementById('setup-name').value;
  if (!name) return alert('Elige tu nombre');

  currentUser = name;
  localStorage.setItem('reto-user', currentUser);

  if (isSebastian()) {
    document.getElementById('habits-config').style.display = 'block';
    document.getElementById('setup-name').disabled = true;
  } else {
    loadHabitsFromFirestore();
  }
}

function addHabitInput() {
  const list = document.getElementById('habits-list');
  const input = document.createElement('div');
  input.className = 'habit-edit-item';
  input.innerHTML = `
    <input type="text" class="setup-input habit-input" placeholder="Hábito">
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(input);
}

async function addDefaultHabits() {
  const list = document.getElementById('habits-list');
  list.innerHTML = '';
  const defaults = ['Actividad física', '2L agua', 'No alcohol', 'No azúcar', 'No procesados', 'No pan', 'Menos celular', 'Meditación'];
  
  for (let habit of defaults) {
    const input = document.createElement('div');
    input.className = 'habit-edit-item';
    input.innerHTML = `
      <input type="text" class="setup-input habit-input" value="${habit}">
      <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
    `;
    list.appendChild(input);
  }
}

async function saveHabits() {
  const inputs = document.querySelectorAll('.habit-input');
  habits = Array.from(inputs).map(i => i.value.trim()).filter(v => v);
  
  if (habits.length === 0) return alert('Agrega al menos un hábito');

  await db.collection('config').doc('habits').set({ habits: habits });
  
  document.getElementById('setup-screen').classList.remove('show');
  document.getElementById('main-app').style.display = 'block';
  document.getElementById('btn-edit').style.display = 'block';
  
  listenToRealTime();
}

async function loadHabitsFromFirestore() {
  const doc = await db.collection('config').doc('habits').get();
  if (doc.exists) {
    habits = doc.data().habits || [];
    document.getElementById('setup-screen').classList.remove('show');
    document.getElementById('main-app').style.display = 'block';
    listenToRealTime();
  }
}

function listenToRealTime() {
  db.collection('days').orderBy('day').onSnapshot(snapshot => {
    data = {};
    snapshot.forEach(doc => {
      data[doc.id] = doc.data();
    });
    render();
  });

  db.collection('closed-days').onSnapshot(snapshot => {
    closedDays = {};
    snapshot.forEach(doc => {
      closedDays[doc.id] = true;
    });
    render();
  });

  db.collection('messages').orderBy('timestamp').onSnapshot(snapshot => {
    messages = [];
    snapshot.forEach(doc => {
      messages.push(doc.data());
    });
    render();
  });

  db.collection('config').doc('habits').onSnapshot(doc => {
    if (doc.exists) {
      habits = doc.data().habits || [];
      render();
    }
  });
}

function getCurrentDay() {
  const start = localStorage.getItem('reto-start');
  if (!start) {
    localStorage.setItem('reto-start', new Date().toISOString());
    return 1;
  }
  const diff = Math.floor((new Date() - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
  return Math.min(Math.max(diff, 1), 30);
}

function isDayIntimacy(day) {
  return day % 3 === 0;
}

async function toggleHabit(day, person, habit) {
  const docRef = db.collection('days').doc(`day-${day}`);
  const docSnap = await docRef.get();
  const docData = docSnap.exists ? docSnap.data() : {};

  if (!docData[person]) docData[person] = {};
  docData[person][habit] = !docData[person][habit];
  docData.day = day;

  await docRef.set(docData);
}

async function toggleSharedHabit(day) {
  const docRef = db.collection('days').doc(`day-${day}`);
  const docSnap = await docRef.get();
  const docData = docSnap.exists ? docSnap.data() : {};

  if (!docData.shared) docData.shared = {};
  docData.shared[sharedHabit] = !docData.shared[sharedHabit];
  docData.day = day;

  await docRef.set(docData);
}

async function closeDay() {
  const today = getCurrentDay();
  await db.collection('closed-days').doc(`day-${today}`).set({ closed: true });
}

async function sendMessage() {
  const text = document.getElementById('message-input').value.trim();
  if (!text) return;

  await db.collection('messages').add({
    sender: currentUser,
    text: text,
    timestamp: new Date()
  });

  document.getElementById('message-input').value = '';
}

function getCompletedCount(day, person) {
  const dayData = data[`day-${day}`] || {};
  return habits.filter(h => dayData[person] && dayData[person][h]).length;
}

function getTotalCompleted(person) {
  let count = 0;
  for (let day = 1; day <= 30; day++) {
    count += getCompletedCount(day, person);
  }
  return count;
}

function getStreak(person) {
  let streak = 0;
  for (let day = getCurrentDay(); day >= 1; day--) {
    const count = getCompletedCount(day, person);
    const dayData = data[`day-${day}`] || {};
    const sharedOk = isDayIntimacy(day) ? (dayData.shared && dayData.shared[sharedHabit]) : true;
    if (count === habits.length && sharedOk) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function openDayModal(day) {
  if (!closedDays[`day-${day}`]) return;

  const dayData = data[`day-${day}`] || {};
  const modal = document.getElementById('day-modal');
  const content = document.getElementById('modal-content');

  document.getElementById('modal-title').textContent = `Día ${day}`;

  let html = '<div class="modal-person"><div class="modal-person-name">Sebastián</div>';
  habits.forEach(h => {
    const ok = dayData.sebastian && dayData.sebastian[h];
    html += `<div style="padding:0.3rem 0;">${ok ? '✓' : '✗'} ${h}</div>`;
  });
  html += '</div><div class="modal-person"><div class="modal-person-name">Ale</div>';
  habits.forEach(h => {
    const ok = dayData.ale && dayData.ale[h];
    html += `<div style="padding:0.3rem 0;">${ok ? '✓' : '✗'} ${h}</div>`;
  });
  html += '</div>';

  if (isDayIntimacy(day)) {
    const ok = dayData.shared && dayData.shared[sharedHabit];
    html += `<div style="grid-column:1/-1;padding:1rem;background:rgba(20,184,166,0.1);border-radius:8px;">${ok ? '✓' : '✗'} 💑 ${sharedHabit}</div>`;
  }

  content.innerHTML = html;
  modal.classList.add('open');
}

function closeDayModal() {
  document.getElementById('day-modal').classList.remove('open');
}

function render() {
  if (isSebastian() || !habits.length) return;

  const today = getCurrentDay();
  const closed = closedDays[`day-${today}`];

  document.getElementById('current-day').textContent = `Día ${today}`;
  document.getElementById('progress-pct').textContent = `${Math.round((getTotalCompleted('sebastian') + getTotalCompleted('ale')) / (60 * habits.length) * 100)}%`;

  const statusEl = document.getElementById('day-status');
  const closeBtn = document.getElementById('close-day-btn');
  if (closed) {
    statusEl.textContent = 'Cerrado';
    statusEl.className = 'header-status closed';
    closeBtn.disabled = true;
  } else {
    statusEl.textContent = 'Abierto';
    statusEl.className = 'header-status open';
    closeBtn.disabled = false;
  }

  // Checklists
  for (let person of ['sebastian', 'ale']) {
    const list = document.getElementById(`list-${person}`);
    list.innerHTML = '';
    habits.forEach(habit => {
      const dayData = data[`day-${today}`] || {};
      const checked = dayData[person] && dayData[person][habit];
      const item = document.createElement('div');
      item.className = `habit-item ${checked ? 'checked' : ''} ${closed ? 'disabled' : ''}`;
      item.innerHTML = `<div class="habit-checkbox">${checked ? '✓' : ''}</div><div class="habit-label">${habit}</div>`;
      if (!closed) item.addEventListener('click', () => toggleHabit(today, person, habit));
      list.appendChild(item);
    });
  }

  // Conexión
  if (isDayIntimacy(today)) {
    const grid = document.querySelector('.people-grid');
    const dayData = data[`day-${today}`] || {};
    const checked = dayData.shared && dayData.shared[sharedHabit];
    
    if (!document.getElementById('shared-item')) {
      const item = document.createElement('div');
      item.id = 'shared-item';
      item.className = `habit-item shared-habit ${checked ? 'checked' : ''} ${closed ? 'disabled' : ''}`;
      item.innerHTML = `<div class="habit-checkbox">${checked ? '✓' : ''}</div><div class="habit-label">💑 ${sharedHabit}</div>`;
      if (!closed) item.addEventListener('click', () => toggleSharedHabit(today));
      grid.appendChild(item);
    } else {
      const item = document.getElementById('shared-item');
      item.className = `habit-item shared-habit ${checked ? 'checked' : ''} ${closed ? 'disabled' : ''}`;
      item.innerHTML = `<div class="habit-checkbox">${checked ? '✓' : ''}</div><div class="habit-label">💑 ${sharedHabit}</div>`;
    }
  } else {
    const item = document.getElementById('shared-item');
    if (item) item.remove();
  }

  // Progress
  const pct1 = Math.round((getTotalCompleted('sebastian') / (30 * habits.length)) * 100);
  const pct2 = Math.round((getTotalCompleted('ale') / (30 * habits.length)) * 100);
  document.getElementById('pct-sebastian').textContent = pct1 + '%';
  document.getElementById('pct-ale').textContent = pct2 + '%';

  // Calendar
  const calendar = document.getElementById('calendar-grid');
  calendar.innerHTML = '';
  for (let day = 1; day <= 30; day++) {
    const cell = document.createElement('div');
    const s = getCompletedCount(day, 'sebastian');
    const a = getCompletedCount(day, 'ale');
    const dayData = data[`day-${day}`] || {};
    const sharedOk = isDayIntimacy(day) ? (dayData.shared && dayData.shared[sharedHabit]) : true;

    let cn = 'day-cell';
    if (day === today) cn += ' today';
    if (closedDays[`day-${day}`]) cn += ' closed';
    if (s === habits.length && a === habits.length && sharedOk) cn += ' complete';
    else if (s > 0 || a > 0) cn += ' partial';
    else cn += ' incomplete';

    cell.className = cn;
    cell.textContent = day;
    if (closedDays[`day-${day}`]) cell.addEventListener('click', () => openDayModal(day));
    calendar.appendChild(cell);
  }

  // Streaks
  document.getElementById('streak-sebastian').textContent = getStreak('sebastian') + ' días';
  document.getElementById('streak-ale').textContent = getStreak('ale') + ' días';

  // Messages
  const list = document.getElementById('messages-list');
  if (!messages.length) {
    list.innerHTML = '<div class="loading">Sin mensajes</div>';
  } else {
    list.innerHTML = [...messages].reverse().map(m => `
      <div class="message-bubble ${m.sender}">
        <div class="message-author">${m.sender === 'sebastian' ? 'Sebastián' : 'Ale'}</div>
        <div class="message-text">${m.text}</div>
      </div>
    `).join('');
  }

  updateCharts();
}

function updateCharts() {
  const p1 = getTotalCompleted('sebastian');
  const p2 = getTotalCompleted('ale');

  const pieCtx = document.getElementById('pie-chart').getContext('2d');
  if (window.pieChart) window.pieChart.destroy();
  window.pieChart = new Chart(pieCtx, {
    type: 'pie',
    data: { labels: ['Sebastián', 'Ale'], datasets: [{ data: [p1, p2], backgroundColor: ['#10b981', '#14b8a6'] }] },
    options: { responsive: true, maintainAspectRatio: true }
  });

  const dCtx = document.getElementById('doughnut-chart').getContext('2d');
  if (window.doughnutChart) window.doughnutChart.destroy();
  window.doughnutChart = new Chart(dCtx, {
    type: 'doughnut',
    data: { labels: ['Hecho', 'Faltante'], datasets: [{ data: [p1 + p2, 60 * habits.length - (p1 + p2)], backgroundColor: ['#f97316', '#e5e7eb'] }] },
    options: { responsive: true, maintainAspectRatio: true }
  });

  const bCtx = document.getElementById('bar-chart').getContext('2d');
  if (window.barChart) window.barChart.destroy();
  const hStats = habits.map(h => {
    let c = 0;
    for (let d = 1; d <= 30; d++) {
      const dd = data[`day-${d}`] || {};
      c += (dd.sebastian && dd.sebastian[h] ? 1 : 0) + (dd.ale && dd.ale[h] ? 1 : 0);
    }
    return (c / 60) * 100;
  });
  window.barChart = new Chart(bCtx, {
    type: 'bar',
    data: { labels: habits, datasets: [{ label: '%', data: hStats, backgroundColor: '#10b981' }] },
    options: { responsive: true, maintainAspectRatio: true, indexAxis: 'y' }
  });
}

function editHabitsMode() {
  document.getElementById('setup-screen').classList.add('show');
  document.getElementById('main-app').style.display = 'none';
  addDefaultHabits();
  
  const btn = document.querySelector('.setup-buttons button');
  btn.textContent = 'Guardar Cambios';
  btn.onclick = saveHabits;
}

window.addEventListener('load', () => {
  const user = localStorage.getItem('reto-user');
  if (user) {
    currentUser = user;
    document.getElementById('setup-screen').classList.add('show');
    document.getElementById('setup-name').value = user;
    document.getElementById('setup-name').disabled = true;
    
    if (user === 'sebastian') {
      document.getElementById('habits-config').style.display = 'block';
    } else {
      loadHabitsFromFirestore();
    }
  } else {
    document.getElementById('setup-screen').classList.add('show');
  }
});
</script>
