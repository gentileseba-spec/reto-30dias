<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 30 Días</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --green: #10b981;
      --teal: #14b8a6;
      --coral: #f97316;
      --sage: #6b7280;
      --text: #1f2937;
      --text-light: #6b7280;
      --bg-0: #ffffff;
      --bg-1: #f9fafb;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f3f4f6;
        --text-light: #d1d5db;
        --bg-0: #111827;
        --bg-1: #1f2937;
        --border: #374151;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-0); color: var(--text); }
    
    .screen { display: none; }
    .screen.active { display: flex; }

    /* SETUP */
    .setup-screen { flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
    .setup-card { background: var(--bg-1); border: 2px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 500px; width: 100%; }
    .setup-title { font-size: 28px; font-weight: 700; margin-bottom: 2rem; text-align: center; background: linear-gradient(135deg, var(--green), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .setup-step { margin-bottom: 1.5rem; }
    .setup-label { font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 0.5rem; text-transform: uppercase; }
    .setup-select, .habit-input { width: 100%; padding: 0.75rem; background: var(--bg-0); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); font-family: inherit; margin-bottom: 0.5rem; }
    .setup-select:focus, .habit-input:focus { outline: none; border-color: var(--teal); }

    .habits-list { max-height: 250px; overflow-y: auto; margin-bottom: 1rem; }
    .habit-row { display: flex; gap: 8px; margin-bottom: 0.5rem; }
    .habit-input { flex: 1; }
    .btn-remove { padding: 0.5rem 0.75rem; background: rgba(249, 115, 22, 0.15); color: var(--coral); border: 1px solid var(--coral); border-radius: 6px; cursor: pointer; font-size: 11px; }
    .btn-add-habit { padding: 0.75rem; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 1rem; }

    .setup-buttons { display: flex; gap: 1rem; }
    .btn-primary { flex: 1; padding: 0.875rem; background: linear-gradient(135deg, var(--green), var(--teal)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

    /* MAIN APP */
    .container { max-width: 100%; padding: 1rem; }
    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.5rem; }
    .header-info { font-size: 12px; color: var(--text-light); }

    .progress-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 2rem; }
    .progress-card { background: var(--bg-1); border: 2px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
    .progress-card .name { font-size: 11px; color: var(--sage); font-weight: 600; margin-bottom: 0.75rem; text-transform: uppercase; }
    .progress-card .pct { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--green), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .calendar-section { margin-bottom: 2rem; }
    .calendar-header { font-size: 13px; font-weight: 600; color: var(--teal); margin-bottom: 1rem; text-transform: uppercase; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-btn { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--bg-1); transition: all 0.2s; }
    .day-btn.today { border: 2px solid var(--coral); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
    .day-btn.complete { background: linear-gradient(135deg, var(--green), var(--teal)); color: white; border-color: var(--green); }
    .day-btn.partial { background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(20, 184, 166, 0.15)); border-color: var(--coral); }
    .day-btn.closed { border-style: dashed; opacity: 0.6; }
    .day-btn:hover { border-color: var(--teal); }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .chart-box { background: var(--bg-1); border: 1.5px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .chart-title { font-size: 12px; font-weight: 600; color: var(--teal); margin-bottom: 1rem; text-align: center; text-transform: uppercase; }

    .actions { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .btn-edit, .btn-reset { flex: 1; padding: 0.75rem; background: var(--bg-1); border: 1.5px solid var(--border); border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-edit:hover, .btn-reset:hover { border-color: var(--teal); }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg-0); border-radius: 12px; max-width: 90vw; max-height: 90vh; overflow-y: auto; padding: 1.5rem; border: 2px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
    .modal-title { font-size: 20px; font-weight: 600; }
    .modal-close { font-size: 24px; cursor: pointer; background: none; border: none; color: var(--text); }

    .modal-content { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .modal-person { background: var(--bg-1); border-radius: 8px; padding: 1.25rem; }
    .modal-person-name { font-size: 13px; font-weight: 600; color: var(--green); margin-bottom: 1rem; text-align: center; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border); text-transform: uppercase; }

    .habit-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem; margin-bottom: 8px; background: var(--bg-0); border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; }
    .habit-item.disabled { opacity: 0.5; cursor: not-allowed; }
    .habit-item.checked { border-color: var(--green); background: rgba(16, 185, 129, 0.05); }

    .habit-check { width: 20px; height: 20px; border: 1.5px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .habit-item.checked .habit-check { background: var(--green); border-color: var(--green); color: white; }

    .habit-text { font-size: 13px; flex: 1; }

    .shared-habit { background: linear-gradient(135deg, rgba(20, 184, 166, 0.1), rgba(16, 185, 129, 0.1)) !important; border-color: var(--teal) !important; grid-column: 1 / -1; }

    .modal-actions { display: flex; gap: 0.75rem; }
    .btn-close-day { flex: 1; padding: 0.875rem; background: linear-gradient(135deg, var(--green), var(--teal)); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-close-day:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back { flex: 1; padding: 0.875rem; background: var(--bg-1); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; }

    .modal-status { font-size: 12px; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; }
    .modal-status.open { background: rgba(16, 185, 129, 0.15); color: var(--green); font-weight: 600; }
    .modal-status.closed { background: rgba(249, 115, 22, 0.15); color: var(--coral); font-weight: 600; }
  </style>
</head>
<body>

<!-- SETUP -->
<div class="screen setup-screen active" id="setup-screen">
  <div class="setup-card">
    <div class="setup-title">🌿 Reto 30 Días</div>
    
    <div class="setup-step">
      <div class="setup-label">¿Quién eres?</div>
      <select class="setup-select" id="name-select">
        <option value="">-- Elige tu nombre --</option>
        <option value="sebastian">Sebastián</option>
        <option value="ale">Ale</option>
      </select>
    </div>

    <div class="setup-step" id="habits-setup" style="display:none;">
      <div class="setup-label">Configura los hábitos (30 días)</div>
      <div class="habits-list" id="habits-list"></div>
      <button class="btn-add-habit" onclick="addHabitRow()">+ Agregar hábito</button>
    </div>

    <div class="setup-buttons">
      <button class="btn-primary" onclick="goApp()">Comenzar</button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="app-screen">
  <div class="container">
    <div class="header">
      <h1>Reto 30 Días</h1>
      <div class="header-info" id="header-info">Día 1 de 30</div>
    </div>

    <div class="progress-cards">
      <div class="progress-card">
        <div class="name">Sebastián</div>
        <div class="pct" id="pct-sebastian">0%</div>
      </div>
      <div class="progress-card">
        <div class="name">Ale</div>
        <div class="pct" id="pct-ale">0%</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-edit" id="btn-edit" style="display:none;" onclick="editHabits()">✎ Editar hábitos</button>
      <button class="btn-reset" id="btn-reset" style="display:none;" onclick="resetReto()">🔄 Reset</button>
    </div>

    <div class="calendar-section">
      <div class="calendar-header">Selecciona un día</div>
      <div class="calendar-grid" id="calendar"></div>
    </div>

    <div class="charts-grid">
      <div class="chart-box">
        <div class="chart-title">Cumplimiento</div>
        <canvas id="pie-chart"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">Progreso Total</div>
        <canvas id="bar-chart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DÍA -->
<div class="modal-overlay" id="day-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-day-title">Día 1</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-status" id="modal-status">Abierto</div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn-close-day" id="btn-close-day" onclick="closeDay()">Cerrar Día</button>
      <button class="btn-back" onclick="closeModal()">Volver</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCW0OoRf_p5WMYZprI3JcsCQiuDlh1vev8",
  authDomain: "reto-30dias.firebaseapp.com",
  projectId: "reto-30dias",
  storageBucket: "reto-30dias.firebasestorage.app",
  messagingSenderId: "415328361570",
  appId: "1:415328361570:web:8762947b9c5453e51b853b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null;
let habits = [];
let totalDays = 30;
let data = {};
let closedDays = {};
let currentDayModal = null;

// ============ SETUP ============

async function goApp() {
  const name = document.getElementById('name-select').value;
  if (!name) return alert('Elige tu nombre');

  currentUser = name;
  localStorage.setItem('reto-user', currentUser);

  if (name === 'sebastian') {
    document.getElementById('habits-setup').style.display = 'block';
    document.getElementById('name-select').disabled = true;
    addDefaultHabits();
  } else {
    await loadHabitsFromDB();
  }
}

function addDefaultHabits() {
  const list = document.getElementById('habits-list');
  list.innerHTML = '';
  const defaults = ['Actividad física', '2L agua', 'No alcohol', 'No azúcar', 'No procesados', 'No pan', 'Menos celular', 'Meditación'];
  defaults.forEach(h => addHabitRow(h));
}

function addHabitRow(text = '') {
  const list = document.getElementById('habits-list');
  const row = document.createElement('div');
  row.className = 'habit-row';
  row.innerHTML = `
    <input type="text" class="habit-input" value="${text}" placeholder="Hábito">
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

async function loadHabitsFromDB() {
  try {
    const doc = await db.collection('config').doc('habits').get();
    if (doc.exists) {
      habits = doc.data().habits || [];
      startApp();
    } else {
      alert('Sebastián aún no configuró los hábitos.');
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// ============ APP ============

async function startApp() {
  if (currentUser === 'sebastian') {
    const inputs = document.querySelectorAll('.habit-input');
    habits = Array.from(inputs).map(i => i.value.trim()).filter(v => v);
    if (habits.length === 0) return alert('Agrega al menos un hábito');
    await db.collection('config').doc('habits').set({ habits });
  }

  document.getElementById('setup-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');

  if (currentUser === 'sebastian') {
    document.getElementById('btn-edit').style.display = 'block';
    document.getElementById('btn-reset').style.display = 'block';
  }

  listenDB();
}

function listenDB() {
  // Escuchar cambios en días
  db.collection('days').onSnapshot(snapshot => {
    data = {};
    snapshot.forEach(doc => {
      data[doc.id] = doc.data();
    });
    render();
  });

  // Escuchar días cerrados
  db.collection('closed-days').onSnapshot(snapshot => {
    closedDays = {};
    snapshot.forEach(doc => {
      closedDays[doc.id] = true;
    });
    render();
  });

  // Escuchar cambios en total de días (por si extienden)
  db.collection('config').doc('settings').onSnapshot(doc => {
    if (doc.exists && doc.data().totalDays) {
      totalDays = doc.data().totalDays;
      render();
    }
  });
}

// ============ RENDER ============

function render() {
  if (!habits.length) return;

  const today = getCurrentDay();

  // Progress
  const sebastian = getTotalCompleted('sebastian');
  const ale = getTotalCompleted('ale');
  const maxTotal = totalDays * habits.length;

  document.getElementById('pct-sebastian').textContent = Math.round((sebastian / maxTotal) * 100) + '%';
  document.getElementById('pct-ale').textContent = Math.round((ale / maxTotal) * 100) + '%';
  document.getElementById('header-info').textContent = `Día ${today} de ${totalDays}`;

  // Calendar
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  for (let day = 1; day <= totalDays; day++) {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    if (day === today) btn.classList.add('today');
    if (closedDays[`day-${day}`]) btn.classList.add('closed');
    
    const s = getCompletedCount(day, 'sebastian');
    const a = getCompletedCount(day, 'ale');
    const shared = isDayIntimacy(day) ? (data[`day-${day}`]?.shared?.Conexión) : true;
    
    if (s === habits.length && a === habits.length && shared) {
      btn.classList.add('complete');
    } else if (s > 0 || a > 0) {
      btn.classList.add('partial');
    }

    btn.textContent = day;
    btn.onclick = () => openDay(day);
    cal.appendChild(btn);
  }

  // Charts
  updateCharts(sebastian, ale);
}

function updateCharts(s, a) {
  const pieCtx = document.getElementById('pie-chart').getContext('2d');
  if (window.pieChart) window.pieChart.destroy();
  window.pieChart = new Chart(pieCtx, {
    type: 'pie',
    data: {
      labels: ['Sebastián', 'Ale'],
      datasets: [{ data: [s, a], backgroundColor: ['#10b981', '#14b8a6'] }]
    },
    options: { responsive: true, maintainAspectRatio: true }
  });

  const barCtx = document.getElementById('bar-chart').getContext('2d');
  if (window.barChart) window.barChart.destroy();

  const dailyData = [];
  for (let day = 1; day <= Math.min(totalDays, 30); day++) {
    const ds = getCompletedCount(day, 'sebastian');
    const da = getCompletedCount(day, 'ale');
    dailyData.push(((ds + da) / (habits.length * 2)) * 100);
  }

  window.barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: Array.from({length: Math.min(totalDays, 30)}, (_, i) => `D${i+1}`),
      datasets: [{ label: 'Progreso %', data: dailyData, backgroundColor: '#10b981' }]
    },
    options: { responsive: true, maintainAspectRatio: true, scales: { y: { max: 100 } } }
  });
}

// ============ MODAL DÍA ============

function openDay(day) {
  currentDayModal = day;
  const dayData = data[`day-${day}`] || {};
  const isClosed = closedDays[`day-${day}`];

  document.getElementById('modal-day-title').textContent = `Día ${day}`;
  
  const status = document.getElementById('modal-status');
  if (isClosed) {
    status.className = 'modal-status closed';
    status.textContent = 'Cerrado';
  } else {
    status.className = 'modal-status open';
    status.textContent = 'Abierto';
  }

  let html = '';

  // Sebastián
  html += `<div class="modal-person"><div class="modal-person-name">Sebastián</div>`;
  habits.forEach(h => {
    const checked = dayData.sebastian?.[h];
    const canEdit = !isClosed && currentUser === 'sebastian';
    html += `<div class="habit-item ${checked ? 'checked' : ''} ${canEdit ? '' : 'disabled'}" onclick="${canEdit ? `toggleHabit(${day}, 'sebastian', '${h}')` : ''}">
      <div class="habit-check">${checked ? '✓' : ''}</div>
      <div class="habit-text">${h}</div>
    </div>`;
  });
  html += '</div>';

  // Ale
  html += `<div class="modal-person"><div class="modal-person-name">Ale</div>`;
  habits.forEach(h => {
    const checked = dayData.ale?.[h];
    const canEdit = !isClosed && currentUser === 'ale';
    html += `<div class="habit-item ${checked ? 'checked' : ''} ${canEdit ? '' : 'disabled'}" onclick="${canEdit ? `toggleHabit(${day}, 'ale', '${h}')` : ''}">
      <div class="habit-check">${checked ? '✓' : ''}</div>
      <div class="habit-text">${h}</div>
    </div>`;
  });
  html += '</div>';

  // Conexión
  if (isDayIntimacy(day)) {
    const checked = dayData.shared?.Conexión;
    const canEdit = !isClosed;
    html += `<div class="habit-item shared-habit ${checked ? 'checked' : ''} ${canEdit ? '' : 'disabled'}" onclick="${canEdit ? `toggleSharedHabit(${day})` : ''}">
      <div class="habit-check">${checked ? '✓' : ''}</div>
      <div class="habit-text">💑 Conexión</div>
    </div>`;
  }

  document.getElementById('modal-content').innerHTML = html;

  const btn = document.getElementById('btn-close-day');
  btn.disabled = isClosed;
  btn.textContent = isClosed ? 'Día Cerrado' : 'Cerrar Día';

  document.getElementById('day-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('day-modal').classList.remove('open');
  currentDayModal = null;
}

// ============ ACCIONES ============

async function toggleHabit(day, person, habit) {
  if (!currentUser) return;
  const docRef = db.collection('days').doc(`day-${day}`);
  const snap = await docRef.get();
  const docData = snap.exists ? snap.data() : {};

  if (!docData[person]) docData[person] = {};
  docData[person][habit] = !docData[person][habit];
  docData.day = day;

  await docRef.set(docData);
  openDay(day); // Refrescar modal
}

async function toggleSharedHabit(day) {
  const docRef = db.collection('days').doc(`day-${day}`);
  const snap = await docRef.get();
  const docData = snap.exists ? snap.data() : {};

  if (!docData.shared) docData.shared = {};
  docData.shared.Conexión = !docData.shared.Conexión;
  docData.day = day;

  await docRef.set(docData);
  openDay(day);
}

async function closeDay() {
  if (!currentDayModal) return;
  await db.collection('closed-days').doc(`day-${currentDayModal}`).set({ closed: true });
  openDay(currentDayModal);
}

function editHabits() {
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('setup-screen').classList.add('active');
  addDefaultHabits();
  document.getElementById('name-select').disabled = true;
}

async function resetReto() {
  if (!confirm('¿Resetear reto? Se borrará TODO.')) return;
  
  // Borrar Firestore
  const batch = db.batch();
  const daysSnap = await db.collection('days').get();
  daysSnap.forEach(doc => batch.delete(doc.ref));
  
  const closedSnap = await db.collection('closed-days').get();
  closedSnap.forEach(doc => batch.delete(doc.ref));

  await batch.commit();

  // Resetear localStorage
  localStorage.removeItem('reto-start');

  location.reload();
}

function editHabits() {
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('setup-screen').classList.add('active');
}

// ============ HELPERS ============

function getCurrentDay() {
  const start = localStorage.getItem('reto-start');
  if (!start) {
    localStorage.setItem('reto-start', new Date().toISOString());
    return 1;
  }
  const diff = Math.floor((new Date() - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
  return Math.min(Math.max(diff, 1), totalDays);
}

function isDayIntimacy(day) {
  return day % 3 === 0;
}

function getCompletedCount(day, person) {
  const dayData = data[`day-${day}`] || {};
  return habits.filter(h => dayData[person]?.[h]).length;
}

function getTotalCompleted(person) {
  let count = 0;
  for (let day = 1; day <= totalDays; day++) {
    count += getCompletedCount(day, person);
  }
  return count;
}

// ============ INIT ============

window.addEventListener('load', () => {
  const user = localStorage.getItem('reto-user');
  if (user) {
    currentUser = user;
    document.getElementById('name-select').value = user;
    document.getElementById('name-select').disabled = true;

    if (user === 'sebastian') {
      document.getElementById('habits-setup').style.display = 'block';
      addDefaultHabits();
    } else {
      loadHabitsFromDB();
    }
  }
});
</script>
